services:
  beseen-interface:
    build:
      context: .
      args:
        NEXT_PUBLIC_BLUX_APP_ID: ${NEXT_PUBLIC_BLUX_APP_ID}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
